<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALH layout test frame</title>
<style>
  html, body { margin: 0; background: #556; font: 12px/1.4 system-ui, sans-serif; }
  #bar { color: #fff; padding: 4px 8px; }
  iframe { border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<div id="bar">loading</div>
<iframe id="f" title="test frame"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var w = parseInt(q.get('w') || '390', 10);
  var h = parseInt(q.get('h') || '844', 10);
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.src = q.get('src') || 'new_coupang.html';
  document.getElementById('bar').textContent = w + '\u00d7' + h + ' \u2014 ' + f.src;
</script>
</body>
</html>
